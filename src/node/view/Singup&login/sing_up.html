<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sing_up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="css/login.css">


</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div id="sing_up" class="login-container d-flex align-items-center justify-content-between ">

            <!-- left-->
            <div class="left-section">
                <img src="img/mail_logo.png" alt="Logo" class="logo mb-3">
                <h2 class="mb-1">Create account</h2>
            </div>

            <!-- right-->
            <div class="right-section">
                <div class="mb-3">
                    <input id="nameInput" type="text" class="form-control mt-2" placeholder="First name">
                    <div class="invalid-feedback">
                        <span class="me-1">❗</span>Enter your first name
                    </div>
                    <input id="surnameInput" type="text" class="form-control mt-2" placeholder="Last name">
                    <input id="birthdayInput" type="date" class="form-control mt-2">
                    <div class="invalid-feedback">
                        <span class="me-1">❗</span>Enter your birthday
                    </div>
                    <input id="passwordInput" type="password" class="form-control mt-2"
                        placeholder="Enter your password">
                    <div class="invalid-feedback">
                        <span class="me-1">❗</span>Password must be at least 8 characters long
                    </div>
                    <input id="confirmPasswordInput" type="password" class="form-control mt-2"
                        placeholder="Confirm password">
                    <div class="invalid-feedback">
                        <span class="me-1">❗</span>Passwords do not match
                    </div>
                    <select id="genderSelect" class="form-select mt-2" aria-label="Default select example">
                        <option selected>Genger</option>
                        <option value="1">Male</option>
                        <option value="2">Female</option>
                        <option value="3">Rather not say</option>
                    </select>

                    <div class="invalid-feedback">
                        <span class="me-1">❗</span>Please select your genger
                    </div>

                    <div class="mb-3">
                        <label for="formFile" class="form-label">Upload a profile picture</label>
                        <input class="form-control mt-2" type="file" id="formFile" accept="img/*">
                    </div>
                </div>


                <!-- buttons-->
                <div class="d-flex justify-content-end">
                    <button id="submitBtn" type="button" class="btn btn-primary mt-2">Next</button>
                </div>
            </div>
        </div>

        <script src="sing_up.js"></script>

</body>

</html>
