<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>inbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="inbox.css">
</head>

<body>


    <div class="mainBar container text-center">
        <div class="row">
            <div class="col-1">
                <!--Navbar Booton -->
                <nav class="navbar navbar-light bg-light px-3">
                    <button class="btn btn-outline-secondary" id="toggleSidebarBtn">
                        <i class="bi bi-list"></i>
                    </button>
                </nav>
            </div>
            <div class="col-2">
                <img src="../Singup&login/img/mail_logo.png" alt="logo" class="img-fluid" style="width: 30px;">
                Mail
            </div>
            <div class="col-9">
                <input type="text" class="form-control" placeholder="Search mail" aria-label="Search mail"
                    aria-describedby="basic-addon1">
            </div>
        </div>
    </div>

    <div id="desktopSidebar" class="d-lg-block bg-light position-fixed p-3 sidebar-visible">
        <ul class="list-group">
          
            <li class="list-group-item d-flex justify-content-between align-items-center" id="composeBtn" >
                <i class="bi bi-pen"></i>
                Compose
                <span class="badge text-bg-primary rounded-pill">14</span>
            </li>
            
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <i class="bi bi-inbox"></i>
                inbox
                <span class="badge text-bg-primary rounded-pill">14</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <i class="bi bi-star"></i>
                starred
                <span class="badge text-bg-primary rounded-pill">2</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <i class="bi bi-alarm"></i>
                snoozed
                <span class="badge text-bg-primary rounded-pill">1</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <i class="bi bi-exclamation-circle-fill"></i>
                important
                <span class="badge text-bg-primary rounded-pill">2</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <i class="bi bi-send"></i>
                sent
                <span class="badge text-bg-primary rounded-pill">1</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <i class="bi bi-file-earmark-text"></i>
                drafts
                <span class="badge text-bg-primary rounded-pill">1</span>
            </li>
        </ul>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center" data-bs-toggle="collapse"
                href="#moreMenuLg" role="button" aria-expanded="false" aria-controls="moreMenuLg">
                <span><i class="bi bi-chevron-down me-2"></i> More</span>
            </li>
            <div class="collapse" id="moreMenuLg">
                <li class="list-group-item"><i class="bi bi-chat-dots me-2"></i> Chats</li>
                <li class="list-group-item"><i class="bi bi-clock me-2"></i> Scheduled</li>
                <li class="list-group-item"><i class="bi bi-envelope-open me-2"></i> All Mail</li>
                <li class="list-group-item d-flex justify-content-between">
                    <span><i class="bi bi-exclamation-octagon me-2"></i> Spam</span>
                    <span class="text-muted">35</span>
                </li>
                <li class="list-group-item"><i class="bi bi-trash me-2"></i> Trash</li>
                <li class="list-group-item"><i class="bi bi-gear me-2"></i> Manage labels</li>
                <li class="list-group-item"><i class="bi bi-plus me-2"></i> Create new label</li>
            </div>
        </ul>
        <h6 class="mt-4 mb-2 text-muted">Labels</h6>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="bi bi-caret-right"></i>Draft</span>
                <span class="text-muted">1</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="bi bi-caret-right"></i>Personal</span>
                <span class="text-muted">1</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><i class="bi bi-caret-right"></i>Studies</span>
                <span class="text-muted">1</span>
            </li>
        </ul>
    </div>
    <div class="mainBlock">
        <div class="toolBar col-9">
            <div class="row">
                <div class="d-flex align-items-center gap-3">
                    <input type="checkbox">
                    <i class="bi bi-arrow-clockwise"></i>
                    <span class="ms-auto">1-50</span>
                    <i class="bi bi-chevron-left"></i>
                    <i class="bi bi-chevron-right"></i>
                </div>
            </div>
        </div>

        <div class="row"></div>
        <div class="container ms-auto" style="height: 600px; width: 1000px; overflow-y: auto;">

            <div class="row">
                <table class="table table-hover align-middle">
                    
                </table>

            </div>

        </div>
    </div>              


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="inbox.js"></script>
</body>

</html>

<!--npm i bootstrap-icons-->
